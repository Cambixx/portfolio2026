<!doctype html>
<!-- Cambia data-palette para cambiar el color de todo el sitio.
     Opciones: gold · violet · cyan · lime · amber · coral · emerald
                blue · acid · iris · mono
     (definidas en src/styles/palettes.css) -->
<html lang="es" data-palette="mono">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <!-- Dark from the first byte: until the stylesheet arrives the page would
         otherwise flash white before the intro on slow connections. -->
    <style>html,body{background:#050505;color-scheme:dark}</style>
    <meta name="description" content="Carlos Rábago — Frontend Developer & Industrial Engineer in Madrid. Modern, dynamic and interactive web interfaces with React, GSAP, Three.js and WordPress (Timber/Twig) for leading brands." />
    <meta property="og:title" content="Carlos Rábago — Frontend Developer & Industrial Engineer" />
    <meta property="og:description" content="Frontend Developer specialized in React, advanced motion with GSAP and Three.js, and WordPress environments — with performance, SEO and accessibility standards baked in." />
    <!-- Link previews (LinkedIn, Slack, X) need absolute URLs and a 1200×630 image. -->
    <link rel="canonical" href="https://carlos-rabago-portfolio.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://carlos-rabago-portfolio.netlify.app/" />
    <meta property="og:image" content="https://carlos-rabago-portfolio.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Carlos Rábago — Frontend Developer & Industrial Engineer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://carlos-rabago-portfolio.netlify.app/og-image.jpg" />
    <title>Carlos Rábago — Frontend Developer & Industrial Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
